<style>
*{
  box-sizing:border-box;

html,body{
  width:100%;
  height:100%;
  overflow:hidden;

canvas{

#ui{

.topbar{

.card{

}

.money small,

}

.money strong{
  font-size:23px;
  color:#63f4ff;
}

.stats{

  gap:8px;
}

.stat{
  padding:10px 14px;
  min-width:105px;
}

.stat strong{
  font-size:14px;
}

.title{
  position:absolute;
  top:18px;
  left:50%;

  letter-spacing:5px;
  font-weight:800;
  text-shadow:0 2px 14px #000;
}

.title span{

  letter-spacing:3px;

#interaction{

  bottom:78px;

#notification{

#hint{

.mobile-btn{

/* BASIC OBJECT HELPERS */

function box(
  x,
  y,
  z,
  sx,
  sy,
  sz,
  mat,
  parent=scene
){

  const m=new THREE.Mesh(
    new THREE.BoxGeometry(
      sx,
      sy,
      sz
    ),
    mat
  );

  m.position.set(
    x,
    y,
    z
  );

  m.castShadow=true;
  m.receiveShadow=true;

  parent.add(m);

  return m;
}


function cyl(
  x,
  y,
  z,
  r,
  h,
  mat,
  parent=scene,
  segments=12
){

  const m=new THREE.Mesh(
    new THREE.CylinderGeometry(
      r,
      r,
      h,
      segments
    ),
    mat
  );

  m.position.set(
    x,
    y,
    z
  );

  m.castShadow=true;
  m.receiveShadow=true;

  parent.add(m);

  return m;
}


function sphere(
  x,
  y,
  z,
  r,
  mat,
  parent=scene
){

  const m=new THREE.Mesh(
    new THREE.SphereGeometry(

  );

  m.position.set(
    x,
    y,
    z
  );

  parent.add(m);

  return m;
}


/* TEXT SPRITES */

function textSprite(
  text,
  color="#63f4ff",
  scale=1
){

  const c=document.createElement(
    "canvas"
  );

  c.width=256;
  c.height=64;

  const ctx=c.getContext("2d");

  ctx.clearRect(
    0,
    0,
    256,
    64
  );

  ctx.font=
    "bold 25px Arial";

  ctx.textAlign="center";

  ctx.fillStyle=color;

  ctx.shadowColor=color;
  ctx.shadowBlur=10;

  ctx.fillText(
    text,
    128,
    40
  );

  const tex=
    new THREE.CanvasTexture(c);

  tex.needsUpdate=true;

  const mat=
    new THREE.SpriteMaterial({
      map:tex,
      transparent:true
    });

  const s=
    new THREE.Sprite(mat);

  s.scale.set(
    3.2*scale,
    .8*scale,
    1
  );

  return s;
}

/* CITY BUILDINGS */

function cityBuilding(
  x,
  z,
  w,
  d,
  h,
  color=0x273545
){

  const mat=
    new THREE.MeshStandardMaterial({
      color,
      roughness:.8,
      metalness:.15
    });

  const g=
    new THREE.Group();

  box(
    x,
    h/2,
    z,
    w,
    h,
    d,
    mat,
    g
  );

  for(
    let yy=3;
    yy<h-1;
    yy+=4
  ){

    for(
      let xx=x-w/2+1.4;
      xx<x+w/2-1;
      xx+=2.7
    ){

      box(
        xx,
        yy,
        z-d/2-.02,
        .8,
        .8,
        .05,
        Math.random()>.25
          ? mats.neon
          : mats.darkSteel,
        g
      );

    }

  }

  scene.add(g);

  return g;
}

let cameraYaw=.35;

let cameraPitch=.25;

let dragging=false;

let lastMouseX=0;

let lastMouseY=0;


renderer.domElement.addEventListener(
  "mousedown",
  e=>{
    dragging=true;
    lastMouseX=e.clientX;
    lastMouseY=e.clientY;
  }
);


window.addEventListener(
  "mouseup",
  ()=>{
    dragging=false;
  }
);


window.addEventListener(
  "mousemove",
  e=>{

    if(!dragging)return;

    cameraYaw-=
      (e.clientX-lastMouseX)*.006;

    cameraPitch-=
      (e.clientY-lastMouseY)*.004;

    cameraPitch=
      THREE.MathUtils.clamp(
        cameraPitch,
        -.05,
        .75
      );

    lastMouseX=e.clientX;
    lastMouseY=e.clientY;

  }
);

const pads=[];


function pad(
  x,
  z,
  label,
  cost,
  id,
  color=mats.neon
){

  const g=
    new THREE.Group();

  const base=
    box(
      x,
      .22,
      z,
      2.7,
      .38,
      1.8,
      color,
      g
    );

  const labelSprite=
    textSprite(
      label,
      "#ffffff",
      .72
    );

  labelSprite.position.set(
    x,
    1.25,
    z
  );

  scene.add(labelSprite);

  g.userData={
    id,
    label,
    cost,
    base,
    labelSprite
  };

  pads.push(g);

  scene.add(g);

  return g;
}

/* MOBILE CONTROLS */

let joyX=0;

let joyY=0;

const joy=
  document.getElementById(
    "joy"
  );

const knob=
  document.getElementById(
    "knob"
  );

let joyActive=false;


function setJoy(e){

  const r=
    joy.getBoundingClientRect();

  const cx=
    r.left+r.width/2;

  const cy=
    r.top+r.height/2;

  const px=
    (e.touches
      ?e.touches[0].clientX
      :e.clientX)-cx;

  const py=
    (e.touches
      ?e.touches[0].clientY
      :e.clientY)-cy;

  const len=
    Math.min(
      48,
      Math.hypot(px,py)
    );

  const ang=
    Math.atan2(py,px);

  joyX=
    Math.cos(ang)*len/48;

  joyY=
    Math.sin(ang)*len/48;

  knob.style.transform=
    `translate(
      ${Math.cos(ang)*len}px,
      ${Math.sin(ang)*len}px
    )`;

}


joy.addEventListener(
  "touchstart",
  e=>{
    joyActive=true;
    setJoy(e);
    e.preventDefault();
  },
  {passive:false}
);


joy.addEventListener(
  "touchmove",
  e=>{
    if(joyActive)
      setJoy(e);

    e.preventDefault();
  },
  {passive:false}
);


joy.addEventListener(
  "touchend",
  ()=>{
    joyActive=false;
    joyX=0;
    joyY=0;
    knob.style.transform="";
  }
);

/* PLAYER MOVEMENT */

function updatePlayer(dt){

  const f=
    new THREE.Vector3(
      Math.sin(cameraYaw),
      0,
      Math.cos(cameraYaw)
    );

  const r=
    new THREE.Vector3(
      Math.cos(cameraYaw),
      0,
      -Math.sin(cameraYaw)
    );

  let mx=0;
  let mz=0;

  if(keys.w)mz-=1;
  if(keys.s)mz+=1;
  if(keys.a)mx-=1;
  if(keys.d)mx+=1;

  if(joyActive){

    mx+=joyX;
    mz+=joyY;

  }

  const len=
    Math.hypot(mx,mz);

  if(len>0){

    mx/=len;
    mz/=len;

  }

  const sprint=
    keys.shift
      ?1.55
      :1;

  const v=
    moveSpeed*sprint;

  player.position.addScaledVector(
    r,
    mx*v*dt
  );

  player.position.addScaledVector(
    f,
    mz*v*dt
  );

  const limit=
    state.plotSize/2-1.1;

  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -limit,
      limit
    );

  player.position.z=
    THREE.MathUtils.clamp(
      player.position.z,
      -limit,
      limit
    );


  velocityY-=22*dt;

  player.position.y+=
    velocityY*dt;

  if(
    player.position.y<=0
  ){

    player.position.y=0;
    velocityY=0;
    grounded=true;

  }


  const moving=
    len>.05;

  const bob=
    moving&&grounded
      ?Math.sin(
        performance.now()*.015*
        sprint
      )*.06
      :0;

  body.position.y=
    1.45+bob;

  armL.rotation.z=
    moving
      ?Math.sin(
        performance.now()*.015
      )*.25
      :0;

  armR.rotation.z=
    moving
      ?-Math.sin(
        performance.now()*.015
      )*.25
      :0;


  const camDist=10;

  const target=
    new THREE.Vector3(

      player.position.x+
        Math.sin(cameraYaw)*
        camDist,

      player.position.y+
        5.5+
        cameraPitch*5,

      player.position.z+
        Math.cos(cameraYaw)*
        camDist

    );


  camera.position.lerp(
    target,
    1-Math.pow(.001,dt)
  );


  camera.lookAt(
    player.position.x,
    player.position.y+1.2,
    player.position.z
  );

}


/* INTERACTION */

function nearestPad(){

  let best=null;

  let dist=999;

  for(
    const p of pads
  ){

    const d=
      new THREE.Vector3(
        p.userData.base.position.x,
        0,
        p.userData.base.position.z
      ).distanceTo(
        new THREE.Vector3(
          player.position.x,
          0,
          player.position.z
        )
      );

    if(d<dist){

      dist=d;
      best=p;

    }

  }

  return dist<3.2
    ?best
    :null;

}


function interact(){

  const p=
    nearestPad();

  if(!p)return;

  const id=
    p.userData.id;

  if(id==="expand"){

    buyExpansion();

    return;

  }

  buyMachine(
    id,
    p.userData.cost
  );

}


function buyMachine(
  id,
  cost
){

  if(state.machines[id]){

    if(id==="upgrader")
      upgradeDropper();

    else
      notify(
        "Already purchased."
      );

    return;

  }


  if(
    state.money<cost
  ){

    notify(
      "Not enough cash."
    );

    return;

  }


  state.money-=cost;

  state.machines[id]=1;

  state.reputation+=1;

  state.xp+=cost*.02;


  burst(
    player.position,
    0x63f4ff,
    16
  );


  if(id==="dropper")
    buildDropper(1);

  if(id==="upgrader")
    buildUpgrader(1);

  if(id==="collector")
    buildCollector(1);

  if(id==="office")
    buildOffice();


  notify(
    "PURCHASED • "+
    id.toUpperCase()
  );


  updateUI();

  saveSilent();

}


function upgradeDropper(){

  if(
    !state.machines.dropper
  ){

    notify(
      "Buy the Dropper first."
    );

    return;

  }


  const level=
    state.machines.dropper;

  const cost=
    Math.floor(
      1000*
      Math.pow(
        1.8,
        level-1
      )
    );


  if(
    state.money<cost
  ){

    notify(
      "Need "+money(cost)
    );

    return;

  }


  state.money-=cost;

  state.machines.dropper++;

  state.reputation++;

  state.xp+=50;


  buildDropper(
    state.machines.dropper
  );


  notify(
    "DROPPER UPGRADED • LV "+
    state.machines.dropper
  );


  burst(
    new THREE.Vector3(
      -6,
      2,
      -3
    ),
    0x63f4ff,
    20
  );


  updateUI();

  saveSilent();

}


function buyExpansion(){

  const cost=
    Math.floor(
      15000*
      Math.pow(
        2,
        state.expansions
      )
    );


  if(
    state.expansions>=3
  ){

    notify(
      "Maximum plot expansion reached in v0.3."
    );

    return;

  }


  if(
    state.money<cost
  ){

    notify(
      "Need "+money(cost)
    );

    return;

  }


  state.money-=cost;

  state.expansions++;

  state.plotSize+=10;

  state.level++;


  buildPlot();


  notify(
    "CITY EXPANDED • PLOT "+
    state.plotSize+
    "x"+
    state.plotSize
  );


  burst(
    player.position,
    0x5fff9a,
    30
  );


  updateUI();

  saveSilent();

}


/* ECONOMY */

function incomePerSecond(){

  let n=
    state.machines.dropper*5;

  if(
    state.machines.upgrader
  ){

    n+=
      state.machines.dropper*4;

  }


  if(
    state.machines.office
  ){

    n+=12;

  }


  if(
    state.machines.tower
  ){

    n+=80;

  }


  n*=
    1+
    state.reputation*.01;

  return n;

}


function money(n){

  if(n<1000)
    return "$"+
      Math.floor(n);

  const units=[
    "K",
    "M",
    "B",
    "T",
    "Qa",
    "Qi"
  ];

  let i=-1;

  let v=n;


  while(
    v>=1000 &&
    i<units.length-1
  ){

    v/=1000;

    i++;

  }


  return "$"+
    v.toFixed(
      v>=100
        ?0
        :v>=10
          ?1
          :2
    )+
    units[i];

}


/* DAY / NIGHT */

function updateSky(dt){

  state.time+=
    dt*.012;


  if(
    state.time>=1
  ){

    state.time=0;

    state.day++;

  }


  const sunAngle=
    state.time*
    Math.PI*2;


  const daylight=
    Math.max(
      0,
      Math.sin(
        sunAngle
      )*.8+.2
    );


  sun.intensity=
    .25+
    daylight*2.5;


  moon.intensity=
    Math.max(
      0,
      (.55-daylight)*1.5
    );


  ambient.intensity=
    .65+
    daylight*1.35;


  const sky=
    new THREE.Color();


  sky.setHSL(
    .62,
    .35,
    .035+
    .075*daylight
  );


  scene.background.lerp(
    sky,
    .03
  );

  scene.fog.color.copy(
    scene.background
  );

}


/* NPC MOVEMENT */

function updateNPCs(dt){

  for(
    const n of npcs
  ){

    const d=
      n.position.distanceTo(
        n.userData.target
      );


    if(d<1){

      n.userData.target.set(
        (Math.random()-.5)*80,
        (Math.random()-.5)*65
      );

    }


    const dir=
      n.userData.target
        .clone()
        .sub(n.position);

    dir.y=0;


    if(
      dir.length()>.1
    ){

      dir.normalize();

      n.position.addScaledVector(
        dir,
        n.userData.speed*dt
      );

      n.rotation.y=
        Math.atan2(
          dir.x,
          dir.z
        );

    }

  }

}

function updateCars(dt){

  for(
    const c of cars
  ){

    c.position.x+=
      c.userData.speed*
      c.userData.dir*
      dt;


    if(
      c.position.x>75
    ){

      c.position.x=-75;

    }


    if(
      c.position.x<-75
    ){

      c.position.x=75;

    }

  }

}


/* CASH */

function updateDrops(dt){

  if(
    state.machines.dropper
  ){

    dropClock+=dt;


    if(
      dropClock>1.15
    ){

      dropClock=0;

      spawnCash();

    }

  }


  for(
    let i=drops.length-1;
    i>=0;
    i--
  ){

    const d=
      drops[i];


    d.userData.progress+=
      dt*2.4;


    d.position.x=
      -6+
      d.userData.progress;


    d.rotation.y+=
      dt*6;


    if(
      d.userData.progress>12
    ){

      scene.remove(d);

      drops.splice(
        i,
        1
      );


      const payout=
        5+
        state.machines.upgrader*3;


      if(
        state.machines.collector
      ){

        state.money+=payout;

      }else{

        state.money+=
          payout*.35;

      }


      state.totalEarned+=
        payout;


      burst(
        new THREE.Vector3(
          6,
          1,
          -5
        ),
        0x5fff9a,
        5
      );

    }

  }

}


let dropClock=0;


/* PARTICLES */

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=
      particles[i];

    p.userData.life-=dt;


    p.position.addScaledVector(
      p.userData.v,
      dt
    );


    p.userData.v.y-=
      5*dt;


    p.scale.multiplyScalar(
      .97
    );


    if(
      p.userData.life<=0
    ){

      scene.remove(p);

      particles.splice(
        i,
        1
      );

    }

  }

}

    money(state.money);


  document.getElementById(
    "income"
  ).textContent=
    money(
      incomePerSecond()
    );


  document.getElementById(
    "rep"
  ).textContent=
    Math.floor(
      state.reputation
    );


  document.getElementById(
    "level"
  ).textContent=
    state.level;

}


function notify(msg){

  const el=
    document.getElementById(
      "notification"
    );


  el.textContent=msg;

  el.style.opacity=1;


  clearTimeout(
    window._nt
  );


  window._nt=
    setTimeout(
      ()=>{
        el.style.opacity=0;
      },
      2200
    );

}


/* PAD DISPLAY */

function updatePads(){

  for(
    const p of pads
  ){

    const id=
      p.userData.id;

    let active=true;


    if(
      id==="dropper" &&
      state.machines.dropper
    ){

      active=false;

    }


    if(
      id==="collector" &&
      state.machines.collector
    ){

      active=false;

    }


    if(
      id==="office" &&
      state.machines.office
    ){

      active=false;

    }


    if(
      id==="upgrader"
    ){

      p.userData.label=
        "UPGRADE • "+
        money(
          1000*
          Math.pow(
            1.8,
            Math.max(
              0,
              state.machines.dropper-1
            )
          )
        );

    }


    p.visible=active;

    p.userData.labelSprite.visible=
      active;

  }

}


/* SAVE */

function saveSilent(){

  state.lastSave=
    Date.now();

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(state)
  );

}


function saveGame(){

  saveSilent();

  notify(
    "GAME SAVED"
  );

}


function loadGame(){

  try{

    const raw=
      localStorage.getItem(
        SAVE_KEY
      );


    if(!raw)
      return;


    const saved=
      JSON.parse(raw);


    Object.assign(
      state,
      saved
    );


    const away=
      Math.min(
        60*60*8,
        (
          Date.now()-
          (
            saved.lastSave||
            Date.now()
          )
        )/1000
      );


    if(away>15){

      const earned=
        incomePerSecond()*
        away*
        .45;


      state.money+=
        earned;


      state.totalEarned+=
        earned;


      setTimeout(
        ()=>{
          notify(
            "WELCOME BACK • "+
            money(earned)+
            " OFFLINE"
          );
        },
        600
      );

    }


  }catch(e){

    console.warn(
      "Save load failed",
      e
    );

  }

}


loadGame();


document
  .getElementById("save")
  .addEventListener(
    "click",
    saveGame
  );


/* RESTORE BUILDINGS */

if(
  state.machines.dropper
){

  buildDropper(
    state.machines.dropper
  );

}


if(
  state.machines.upgrader
){

  buildUpgrader(1);

}


if(
  state.machines.collector
){

  buildCollector(1);

}


if(
  state.machines.office
){

  buildOffice();

}


if(
  state.machines.tower
){

  buildTower();

}


updateUI();

updatePads();


/* INTERACTION PROMPT */

function updatePrompt(){

  const el=
    document.getElementById(
      "interaction"
    );


  const p=
    nearestPad();


  if(!p){

    el.style.display=
      "none";

    return;

  }


  const id=
    p.userData.id;


  let label=
    p.userData.label;


  if(
    id==="upgrader"
  ){

    label=
      "UPGRADE • "+
      money(
        1000*
        Math.pow(
          1.8,
          Math.max(
            0,
            state.machines.dropper-1
          )
        )
      );

  }


  if(
    id==="expand"
  ){

    label=
      "EXPAND • "+
      money(
        15000*
        Math.pow(
          2,
          state.expansions
        )
      );

  }


  el.textContent=
    "E  •  "+
    label;


  el.style.display=
    "block";

}


/* MAIN LOOP */

let incomeClock=0;

let autosaveClock=0;


function loop(){

  requestAnimationFrame(
    loop
  );


  const dt=
    Math.min(
      .05,
      clock.getDelta()
    );


  updatePlayer(dt);

  updateSky(dt);

  updateNPCs(dt);

  updateCars(dt);

  updateDrops(dt);

  updateParticles(dt);

  updatePrompt();


  incomeClock+=dt;


  if(
    incomeClock>=1
  ){

    incomeClock=0;


    const inc=
      incomePerSecond();


    state.money+=inc;

    state.totalEarned+=inc;

    state.xp+=
      inc*.03;


    if(
      state.xp>=
      state.level*1000
    ){

      state.xp-=
        state.level*1000;

      state.level++;


      notify(
        "CITY LEVEL "+
        state.level+
        " REACHED"
      );


      burst(
        player.position,
        0x63f4ff,
        24
      );

    }


    updateUI();

  }


  autosaveClock+=dt;


  if(
    autosaveClock>=10
  ){

    autosaveClock=0;

    saveSilent();

  }


  renderer.render(
    scene,
    camera
  );

}


loop();


/* AUTO SAVE */

window.addEventListener(
  "beforeunload",
  saveSilent
);


/* RESIZE */

window.addEventListener(
  "resize",
  ()=>{
    
    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* OFFICE REPUTATION */

setInterval(
  ()=>{

    if(
      state.machines.office
    ){

      state.reputation+=.05;

      updateUI();

    }

  },
  5000
);

</script>

</body>
</html>
