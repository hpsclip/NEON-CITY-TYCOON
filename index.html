<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon City Tycoon v0.4</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#091018;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  user-select:none;
}

canvas{
  display:block;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:#fff;
}

.panel{
  background:rgba(8,14,23,.88);
  border:1px solid rgba(255,255,255,.1);
  border-radius:13px;
  box-shadow:0 10px 35px rgba(0,0,0,.3);
  backdrop-filter:blur(12px);
}

#top{
  position:absolute;
  left:16px;
  right:16px;
  top:14px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

#brand{
  position:absolute;
  left:50%;
  top:14px;
  transform:translateX(-50%);
  text-align:center;
  pointer-events:none;
  font-size:13px;
  font-weight:800;
  letter-spacing:6px;
  white-space:nowrap;
  text-shadow:0 2px 10px #000;
}

#brand span{
  display:block;
  margin-top:5px;
  font-size:7px;
  letter-spacing:3px;
  color:#62eaff;
}

#cashBox{
  min-width:150px;
  padding:11px 15px;
}

.label{
  color:#7e8da0;
  font-size:8px;
  letter-spacing:2px;
  text-transform:uppercase;
}

#cash{
  margin-top:3px;
  color:#64edff;
  font-size:23px;
  font-weight:800;
}

#stats{
  display:flex;
  gap:7px;
}

.stat{
  min-width:105px;
  padding:10px 12px;
}

.stat strong{
  display:block;
  margin-top:3px;
  font-size:14px;
}

#bottomHint{
  position:absolute;
  left:16px;
  bottom:16px;
  padding:9px 12px;
  font-size:10px;
  color:#94a3b7;
}

#saveBtn{
  position:absolute;
  right:16px;
  bottom:16px;
  pointer-events:auto;
  cursor:pointer;
  color:#a9b7c9;
  border:0;
  padding:9px 14px;
  font-size:10px;
}

#interaction{
  position:absolute;
  left:50%;
  bottom:76px;
  transform:translateX(-50%);
  display:none;
  padding:11px 18px;
  background:rgba(7,12,20,.95);
  border:1px solid #5deaff;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
  box-shadow:0 0 25px rgba(93,234,255,.13);
}

#notification{
  position:absolute;
  top:86px;
  left:50%;
  transform:translateX(-50%) translateY(-8px);
  opacity:0;
  padding:10px 17px;
  background:rgba(7,12,20,.94);
  border:1px solid rgba(93,234,255,.3);
  border-radius:9px;
  font-size:11px;
  transition:.22s;
}

#notification.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

#businessPanel{
  position:absolute;
  right:16px;
  top:125px;
  width:245px;
  padding:15px;
  display:none;
}

#businessPanel h2{
  font-size:16px;
  margin-bottom:5px;
}

#businessPanel p{
  color:#8291a4;
  font-size:10px;
  line-height:1.5;
}

#businessPanel .row{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  font-size:11px;
}

#businessPanel button{
  width:100%;
  border:0;
  border-radius:7px;
  padding:10px;
  margin-top:12px;
  background:#62eaff;
  color:#061016;
  font-weight:800;
  cursor:pointer;
}

#levelBox{
  position:absolute;
  left:50%;
  bottom:17px;
  transform:translateX(-50%);
  width:190px;
}

#levelText{
  display:flex;
  justify-content:space-between;
  color:#9aaabd;
  font-size:8px;
  margin-bottom:4px;
}

#xpTrack{
  height:5px;
  overflow:hidden;
  background:#182331;
  border-radius:5px;
}

#xpBar{
  height:100%;
  width:0%;
  background:#62eaff;
  box-shadow:0 0 10px #62eaff;
}

#mobile{
  display:none;
  position:absolute;
  inset:0;
  pointer-events:none;
}

#joystick{
  position:absolute;
  left:22px;
  bottom:76px;
  width:115px;
  height:115px;
  border-radius:50%;
  background:rgba(5,11,18,.35);
  border:1px solid rgba(255,255,255,.2);
  pointer-events:auto;
}

#stick{
  position:absolute;
  left:33px;
  top:33px;
  width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(98,234,255,.35);
  border:1px solid #62eaff;
}

.mobileButton{
  position:absolute;
  width:62px;
  height:62px;
  border-radius:50%;
  border:1px solid #62eaff;
  background:rgba(5,11,18,.7);
  color:#fff;
  font-weight:800;
  pointer-events:auto;
}

#jumpBtn{
  right:25px;
  bottom:83px;
}

#actionBtn{
  right:102px;
  bottom:42px;
  width:55px;
  height:55px;
}

@media(max-width:700px){

  #stats{
    display:none;
  }

  #brand{
    font-size:9px;
    letter-spacing:4px;
    top:11px;
  }

  #brand span{
    font-size:6px;
  }

  #top{
    top:9px;
    left:9px;
    right:9px;
  }

  #cashBox{
    min-width:120px;
    padding:9px 12px;
  }

  #cash{
    font-size:19px;
  }

  #bottomHint{
    display:none;
  }

  #levelBox{
    bottom:15px;
  }

  #mobile{
    display:block;
  }
}
</style>
</head>

<body>

<div id="ui">

  <div id="top">

    <div id="cashBox" class="panel">
      <div class="label">Cash</div>
      <div id="cash">$500</div>
    </div>

    <div id="stats">

      <div class="stat panel">
        <div class="label">Income / Sec</div>
        <strong id="income">$0</strong>
      </div>

      <div class="stat panel">
        <div class="label">Customers</div>
        <strong id="customers">0</strong>
      </div>

      <div class="stat panel">
        <div class="label">Reputation</div>
        <strong id="rep">1</strong>
      </div>

      <div class="stat panel">
        <div class="label">District</div>
        <strong id="district">1</strong>
      </div>

    </div>

  </div>

  <div id="brand">
    NEON CITY TYCOON
    <span>BUILD • GROW • DOMINATE</span>
  </div>

  <div id="notification">
    Welcome
  </div>

  <div id="interaction">
    E • INTERACT
  </div>

  <div id="businessPanel" class="panel">
    <h2 id="businessName">Business</h2>
    <p id="businessDescription">
      Build your first business.
    </p>

    <div class="row">
      <span>Level</span>
      <strong id="businessLevel">1</strong>
    </div>

    <div class="row">
      <span>Customers</span>
      <strong id="businessCustomers">0</strong>
    </div>

    <div class="row">
      <span>Income</span>
      <strong id="businessIncome">$0/s</strong>
    </div>

    <button id="upgradeBusiness">
      UPGRADE
    </button>
  </div>

  <div id="levelBox">
    <div id="levelText">
      <span>CITY LEVEL <b id="cityLevel">1</b></span>
      <span id="xpText">0 / 100</span>
    </div>

    <div id="xpTrack">
      <div id="xpBar"></div>
    </div>
  </div>

  <div id="bottomHint" class="panel">
    WASD • MOVE &nbsp; SHIFT • SPRINT &nbsp; SPACE • JUMP &nbsp; MOUSE • LOOK &nbsp; E • INTERACT
  </div>

  <button id="saveBtn" class="panel">
    SAVE
  </button>

  <div id="mobile">

    <div id="joystick">
      <div id="stick"></div>
    </div>

    <button id="actionBtn" class="mobileButton">
      E
    </button>

    <button id="jumpBtn" class="mobileButton">
      ↑
    </button>

  </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* ============================================================
   NEON CITY TYCOON v0.4

   Core philosophy:

   1. The city should feel alive.
   2. The player should feel controllable.
   3. Your business should physically exist.
   4. NPCs should have a reason to move.
   5. Money should come from activity.
   6. The world should look good without killing performance.
============================================================ */


/* ============================================================
   SAVE DATA
============================================================ */

const SAVE_KEY =
  "NEON_CITY_TYCOON_V04";


const state = {

  cash: 500,

  reputation: 1,

  level: 1,

  xp: 0,

  totalEarned: 0,

  district: 1,

  plotSize: 28,

  businessLevel: 0,

  businessCustomers: 0,

  expansions: 0,

  lastSave: Date.now()

};


/* ============================================================
   THREE.JS SETUP
============================================================ */

const scene =
  new THREE.Scene();


scene.background =
  new THREE.Color(
    0x0b1420
  );


scene.fog =
  new THREE.Fog(
    0x0b1420,
    45,
    145
  );


const camera =
  new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    .1,
    500
  );


camera.position.set(
  10,
  7,
  12
);


const renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });


renderer.setSize(
  innerWidth,
  innerHeight
);


renderer.setPixelRatio(
  Math.min(
    devicePixelRatio,
    1.35
  )
);


renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


document.body.appendChild(
  renderer.domElement
);


const clock =
  new THREE.Clock();


/* ============================================================
   LIGHTING
============================================================ */

const hemi =
  new THREE.HemisphereLight(
    0xb9dcff,
    0x1b2531,
    1.55
  );


scene.add(hemi);


const sun =
  new THREE.DirectionalLight(
    0xfff3dc,
    2.5
  );


sun.position.set(
  35,
  55,
  25
);


sun.castShadow = true;


sun.shadow.mapSize.set(
  1024,
  1024
);


sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;


scene.add(sun);


const moon =
  new THREE.DirectionalLight(
    0x6688ff,
    0
  );


moon.position.set(
  -30,
  45,
  -25
);


scene.add(moon);


/* ============================================================
   MATERIAL HELPERS
============================================================ */

function mat(
  color,
  options={}
){

  return new THREE.MeshStandardMaterial({
    color,
    roughness:
      options.roughness ??
      .72,
    metalness:
      options.metalness ??
      .05,
    emissive:
      options.emissive ??
      0x000000,
    emissiveIntensity:
      options.emissiveIntensity ??
      0
  });

}


const M = {

  ground:
    mat(
      0x18271f,
      {roughness:.95}
    ),

  grass:
    mat(
      0x274032,
      {roughness:.95}
    ),

  sidewalk:
    mat(
      0x747f89,
      {roughness:.95}
    ),

  road:
    mat(
      0x20262d,
      {roughness:.95}
    ),

  roadDark:
    mat(
      0x14191f,
      {roughness:.98}
    ),

  white:
    mat(
      0xe8edf0
    ),

  building1:
    mat(
      0x34404d,
      {roughness:.72}
    ),

  building2:
    mat(
      0x283441,
      {roughness:.72}
    ),

  building3:
    mat(
      0x414d5c,
      {roughness:.68}
    ),

  glass:
    mat(
      0x4ba7bc,
      {
        roughness:.15,
        metalness:.3,
        emissive:0x123e4c,
        emissiveIntensity:.7
      }
    ),

  cyan:
    mat(
      0x5cecff,
      {
        emissive:0x23b9d0,
        emissiveIntensity:2.2
      }
    ),

  cyanDark:
    mat(
      0x1b8194,
      {
        emissive:0x0c3d48,
        emissiveIntensity:1
      }
    ),

  yellow:
    mat(
      0xffd35a,
      {
        emissive:0x7d5412,
        emissiveIntensity:.7
      }
    ),

  green:
    mat(
      0x5cf59b,
      {
        emissive:0x168346,
        emissiveIntensity:1
      }
    ),

  red:
    mat(
      0xff5d70,
      {
        emissive:0x701b28,
        emissiveIntensity:.7
      }
    ),

  black:
    mat(
      0x111820
    ),

  steel:
    mat(
      0x4b5b6c,
      {
        metalness:.55,
        roughness:.38
      }
    ),

  darkSteel:
    mat(
      0x202b37,
      {
        metalness:.5,
        roughness:.4
      }
    ),

  player:
    mat(
      0x4165f4,
      {roughness:.65}
    ),

  skin:
    mat(
      0xf2c39f,
      {roughness:.85}
    ),

  money:
    mat(
      0x62ff9d,
      {
        emissive:0x16a855,
        emissiveIntensity:1.7
      }
    )

};


/* ============================================================
   OBJECT HELPERS
============================================================ */

function box(
  x,
  y,
  z,
  w,
  h,
  d,
  material,
  parent=scene
){

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      material
    );


  mesh.position.set(
    x,
    y,
    z
  );


  mesh.castShadow = true;
  mesh.receiveShadow = true;


  parent.add(mesh);


  return mesh;

}


function cyl(
  x,
  y,
  z,
  r,
  h,
  material,
  parent=scene,
  segments=12
){

  const mesh =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        r,
        r,
        h,
        segments
      ),
      material
    );


  mesh.position.set(
    x,
    y,
    z
  );


  mesh.castShadow = true;
  mesh.receiveShadow = true;


  parent.add(mesh);


  return mesh;

}


function sphere(
  x,
  y,
  z,
  r,
  material,
  parent=scene
){

  const mesh =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        r,
        12,
        8
      ),
      material
    );


  mesh.position.set(
    x,
    y,
    z
  );


  mesh.castShadow = true;


  parent.add(mesh);


  return mesh;

}


/* ============================================================
   WORLD GROUND
============================================================ */

box(
  0,
  -.75,
  0,
  180,
  1.5,
  180,
  M.ground
);


/* ============================================================
   ROAD SYSTEM
============================================================ */

function roadHorizontal(
  z,
  width=150
){

  box(
    0,
    .02,
    z,
    width,
    .08,
    10,
    M.road
  );


  box(
    0,
    .08,
    z-5.7,
    width,
    .12,
    1.2,
    M.sidewalk
  );


  box(
    0,
    .08,
    z+5.7,
    width,
    .12,
    1.2,
    M.sidewalk
  );


  for(
    let x=-70;
    x<70;
    x+=8
  ){

    box(
      x,
      .09,
      z,
      4,
      .025,
      .12,
      M.white
    );

  }

}


function roadVertical(
  x,
  height=150
){

  box(
    x,
    .02,
    0,
    10,
    .08,
    height,
    M.road
  );


  box(
    x-5.7,
    .08,
    0,
    1.2,
    .12,
    height,
    M.sidewalk
  );


  box(
    x+5.7,
    .08,
    0,
    1.2,
    .12,
    height,
    M.sidewalk
  );


  for(
    let z=-70;
    z<70;
    z+=8
  ){

    box(
      x,
      .09,
      z,
      .12,
      .025,
      4,
      M.white
    );

  }

}


roadHorizontal(35);
roadHorizontal(-35);

roadVertical(35);
roadVertical(-35);


/* ============================================================
   CROSSWALKS
============================================================ */

function crosswalk(
  x,
  z,
  horizontal=true
){

  for(
    let i=-3;
    i<=3;
    i++
  ){

    if(horizontal){

      box(
        x+i*1.25,
        .11,
        z,
        .65,
        .035,
        4.5,
        M.white
      );

    }else{

      box(
        x,
        .11,
        z+i*1.25,
        4.5,
        .035,
        .65,
        M.white
      );

    }

  }

}


crosswalk(
  0,
  35,
  true
);

crosswalk(
  35,
  0,
  false
);

crosswalk(
  0,
  -35,
  true
);

crosswalk(
  -35,
  0,
  false
);


/* ============================================================
   TREES
============================================================ */

function tree(
  x,
  z
){

  const g =
    new THREE.Group();


  cyl(
    0,
    1.4,
    0,
    .18,
    2.8,
    M.darkSteel,
    g,
    8
  );


  sphere(
    0,
    3.1,
    0,
    .9,
    M.grass,
    g
  );


  sphere(
    -.45,
    3.3,
    .15,
    .65,
    M.grass,
    g
  );


  sphere(
    .45,
    3.35,
    -.1,
    .7,
    M.grass,
    g
  );


  g.position.set(
    x,
    0,
    z
  );


  scene.add(g);

}


const treeSpots = [

  [-25,27],
  [-18,27],
  [18,27],
  [25,27],

  [-25,43],
  [-18,43],
  [18,43],
  [25,43],

  [-43,-25],
  [-43,-18],
  [-43,18],
  [-43,25],

  [43,-25],
  [43,-18],
  [43,18],
  [43,25]

];


for(
  const [x,z]
  of treeSpots
){

  tree(x,z);

}


/* ============================================================
   STREET LIGHTS
============================================================ */

const streetLights=[];


function streetLight(
  x,
  z,
  rotation=0
){

  const g =
    new THREE.Group();


  box(
    0,
    2.2,
    0,
    .13,
    4.4,
    .13,
    M.darkSteel,
    g
  );


  box(
    .45,
    4.3,
    0,
    .9,
    .12,
    .12,
    M.darkSteel,
    g
  );


  const lamp =
    box(
      .85,
      4.15,
      0,
      .3,
      .22,
      .3,
      M.cyan,
      g
    );


  g.rotation.y =
    rotation;


  g.position.set(
    x,
    0,
    z
  );


  scene.add(g);

  streetLights.push(lamp);

}


for(
  let i=-60;
  i<=60;
  i+=15
){

  streetLight(
    i,
    28,
    0
  );

  streetLight(
    i,
    42,
    Math.PI
  );

  streetLight(
    28,
    i,
    Math.PI/2
  );

  streetLight(
    42,
    i,
    -Math.PI/2
  );

}


/* ============================================================
   BUILDINGS
============================================================ */

const buildingWindows=[];


function cityBuilding(
  x,
  z,
  width,
  depth,
  height,
  material,
  sign=false
){

  const g =
    new THREE.Group();


  box(
    0,
    height/2,
    0,
    width,
    height,
    depth,
    material,
    g
  );


  /* Roof */

  box(
    0,
    height+.08,
    0,
    width+.25,
    .16,
    depth+.25,
    M.darkSteel,
    g
  );


  /* Windows */

  const floors =
    Math.floor(
      height/3.2
    );


  const cols =
    Math.max(
      2,
      Math.floor(
        width/2.4
      )
    );


  for(
    let floor=0;
    floor<floors;
    floor++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      const wx =
        -width/2+
        1.1+
        c*(
          (width-2.2)/
          Math.max(
            1,
            cols-1
          )
        );


      const wy =
        2+
        floor*3.1;


      const window =
        box(
          wx,
          wy,
          -depth/2-.035,
          .85,
          1.15,
          .06,
          Math.random()>.2
            ?M.glass
            :M.darkSteel,
          g
        );


      buildingWindows.push(
        window
      );

    }

  }


  /* Entrance */

  box(
    0,
    1.2,
    -depth/2-.08,
    2,
    2.4,
    .1,
    M.darkSteel,
    g
  );


  box(
    0,
    1.35,
    -depth/2-.14,
    1.2,
    1.7,
    .05,
    M.glass,
    g
  );


  if(sign){

    box(
      0,
      height*.62,
      -depth/2-.1,
      Math.min(
        width*.75,
        6
      ),
      .7,
      .08,

    );

  }


  g.position.set(

}

  "mousedown",
  e => {

    mouseDown = true;

    lastMouseX =
      e.clientX;

    lastMouseY =
      e.clientY;

  }
);

  "mouseup",
  () => {

    mouseDown = false;

  }
);


window.addEventListener(
  "mousemove",
  e => {

    if(!mouseDown)
      return;


    const dx =
      e.clientX -
      lastMouseX;


    const dy =
      e.clientY -
      lastMouseY;


    yaw -=
      dx*.006;


    pitch -=
      dy*.004;


    pitch =
      THREE.MathUtils.clamp(
        pitch,
        -.15,
        .65
      );


    lastMouseX =
      e.clientX;

    lastMouseY =
      e.clientY;

  }
);

let joystickX = 0;

let joystickY = 0;

let joystickActive = false;


const joystick =
  document.getElementById(
    "joystick"
  );


const stick =
  document.getElementById(
    "stick"
  );


function updateJoystick(e){

  const rect =
    joystick.getBoundingClientRect();


  const touch =
    e.touches[0];


  const cx =
    rect.left+
    rect.width/2;


  const cy =
    rect.top+
    rect.height/2;


  let dx =
    touch.clientX-cx;


  let dy =
    touch.clientY-cy;


  const distance =
    Math.hypot(
      dx,
      dy
    );


  const max =
    43;


  if(distance>max){

    dx =
      dx/distance*max;

    dy =
      dy/distance*max;

  }


  joystickX =
    dx/max;


  joystickY =
    dy/max;


  stick.style.transform =
    `translate(${dx}px,${dy}px)`;

}


joystick.addEventListener(
  "touchstart",
  e => {

    joystickActive = true;

    updateJoystick(e);

    e.preventDefault();

  },
  {passive:false}
);


joystick.addEventListener(
  "touchmove",
  e => {

    if(
      joystickActive
    ){

      updateJoystick(e);

    }

    e.preventDefault();

  },
  {passive:false}
);


joystick.addEventListener(
  "touchend",
  () => {

    joystickActive = false;

    joystickX = 0;

    joystickY = 0;

    stick.style.transform =
      "";

  }
);

/* ============================================================
   PLAYER UPDATE
============================================================ */

function updatePlayer(dt){

  const forward =
    new THREE.Vector3(
      Math.sin(yaw),
      0,
      Math.cos(yaw)
    );


  const right =
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );


  let inputX = 0;

  let inputZ = 0;


  if(keys.w)
    inputZ -= 1;


  if(keys.s)
    inputZ += 1;


  if(keys.a)
    inputX -= 1;


  if(keys.d)
    inputX += 1;


  if(joystickActive){

    inputX += joystickX;

    inputZ += joystickY;

  }


  const length =
    Math.hypot(
      inputX,
      inputZ
    );


  if(length>1){

    inputX /= length;

    inputZ /= length;

  }


  const sprint =
    keys.shift
      ?1.65
      :1;


  const maxSpeed =
    6.2*sprint;


  const target =
    new THREE.Vector3();


  target.addScaledVector(
    right,
    inputX
  );


  target.addScaledVector(
    forward,
    inputZ
  );


  if(
    target.lengthSq()>0.01
  ){

    target.normalize();

    target.multiplyScalar(
      maxSpeed
    );

    moveVelocity.lerp(
      target,
      1-Math.pow(
        .0001,
        dt
      )
    );


    const targetRotation =
      Math.atan2(
        moveVelocity.x,
        moveVelocity.z
      );


    let diff =
      targetRotation-
      player.rotation.y;


    while(diff>Math.PI)
      diff-=Math.PI*2;


    while(diff<-Math.PI)
      diff+=Math.PI*2;


    player.rotation.y +=
      diff*
      Math.min(
        1,
        dt*12
      );

  }else{

    moveVelocity.multiplyScalar(
      Math.pow(
        .00005,
        dt
      )
    );

  }


  player.position.addScaledVector(
    moveVelocity,
    dt
  );


  /* Jump physics */

  velocityY -=
    23*dt;


  player.position.y +=
    velocityY*dt;


  if(
    player.position.y<=0
  ){

    player.position.y=0;

    velocityY=0;

    grounded=true;

  }


  /* Plot boundaries */

  const limit =
    state.plotSize/2-
    1;


  player.position.x =
    THREE.MathUtils.clamp(
      player.position.x,
      -limit,
      limit
    );


  player.position.z =
    THREE.MathUtils.clamp(
      player.position.z,
      -limit,
      limit
    );


  /* Walking animation */

  const moving =
    moveVelocity.length()>0.2;


  const anim =
    performance.now()*.012;


  if(
    moving &&
    grounded
  ){

    legLeft.rotation.x =
      Math.sin(anim)*.45;


    legRight.rotation.x =
      -Math.sin(anim)*.45;


    armLeft.rotation.x =
      -Math.sin(anim)*.35;


    armRight.rotation.x =
      Math.sin(anim)*.35;

  }else{

    legLeft.rotation.x *= .8;

    legRight.rotation.x *= .8;

    armLeft.rotation.x *= .8;

    armRight.rotation.x *= .8;

  }


  /* Camera */

  const distance = 9.5;


  const desiredCamera =
    new THREE.Vector3(
      player.position.x+
      Math.sin(yaw)*
      distance,

      player.position.y+
      4.8+
      pitch*4,

      player.position.z+
      Math.cos(yaw)*
      distance
    );


  camera.position.lerp(
    desiredCamera,
    1-Math.pow(
      .00001,
      dt
    )
  );


  camera.lookAt(
    player.position.x,
    player.position.y+1.45,
    player.position.z
  );

}

function makeText(
  text,
  color="#ffffff"
){

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width=512;
  canvas.height=128;


  const ctx =
    canvas.getContext("2d");


  ctx.clearRect(
    0,
    0,
    512,
    128
  );


  ctx.font =
    "bold 40px Arial";


  ctx.textAlign =
    "center";


  ctx.textBaseline =
    "middle";


  ctx.fillStyle =
    color;


  ctx.shadowColor =
    color;


  ctx.shadowBlur =
    12;


  ctx.fillText(
    text,
    256,
    64
  );


  const texture =
    new THREE.CanvasTexture(
      canvas
    );


  texture.colorSpace =
    THREE.SRGBColorSpace;


  const sprite =
    new THREE.Sprite(
      new THREE.SpriteMaterial({
        map:texture,
        transparent:true
      })
    );


  return sprite;

}

function sendCustomer(
  npc
){

  if(
    state.businessLevel<=0
  )
    return;


  if(
    npc.userData.isCustomer
  )
    return;


  if(
    Math.random()>.35
  )
    return;


  npc.userData.isCustomer=true;

  npc.userData.state=
    "customer";

  npc.userData.target =
    new THREE.Vector3(
      0,
      0,
      -8
    );


  customerNPCs.push(
    npc
  );

}


function updateNPCs(dt){

  for(
    const npc of npcs
  ){

    const data =
      npc.userData;


    data.wait -= dt;


    if(
      data.wait<=0 &&
      data.state==="walking"
    ){

      data.target =
        randomSidewalkPoint();

    }


    if(
      data.state==="customer"
    ){

      const target =
        new THREE.Vector3(
          0,
          0,
          -8
        );


      data.target =
        target;


      if(
        npc.position.distanceTo(
          target
        )<2
      ){

        data.state =
          "shopping";

        data.wait =
          2+
          Math.random()*4;

        state.businessCustomers++;

        state.reputation += .015;

        addCash(
          8+
          state.businessLevel*
          4
        );

      }

    }


    if(
      data.state==="shopping"
    ){

      if(
        data.wait<=0
      ){

        data.state =
          "walking";

        data.isCustomer=false;

        data.target =
          randomSidewalkPoint();

      }

    }


    const direction =
      data.target
        .clone()
        .sub(npc.position);


    direction.y=0;


    if(
      direction.length()>.5
    ){

      direction.normalize();


      npc.position.addScaledVector(
        direction,
        data.speed*dt
      );


      npc.rotation.y =
        Math.atan2(
          direction.x,
          direction.z
        );

    }


    if(
      data.state==="walking" &&
      Math.random()<.003
    ){

      sendCustomer(
        npc
      );

    }

  }

}


/* ============================================================
   TRAFFIC
============================================================ */

  z,
  direction,
  color
){

      }

  box(

    .62,
    0,

  );

    1.04,
    0,
    1.55,
    .5,
    1.7,

  );


  for(

  ){

    for(

        zz,
        .25,
        .16,

        10
      );

    }

  }


  box(
    -.65,
    .72,
    -2.02,
    .25,
    .18,
    .05,
    M.yellow,
    g
  );

    -2.02,
    .25,
    .18,

    M.yellow,
    g
  );

    z
  );


  g.userData={

    speed:
      4+

  };


  scene.add(g);

  cars.push(g);

}

/* ============================================================
   CASH PARTICLES
============================================================ */

const floatingCash=[];


function addCash(
  amount
){

  state.cash +=
    amount;


  state.totalEarned +=
    amount;


  gainXP(
    Math.max(
      1,
      Math.floor(
        amount*.4
      )
    )
  );


  spawnCashParticle(
    amount
  );


  updateUI();

}


function spawnCashParticle(
  amount
){

  const g =
    new THREE.Group();


  const bill =
    box(
      0,
      0,
      0,
      .35,
      .08,
      .2,
      M.money,
      g
    );


  g.position.set(
    (Math.random()-.5)*3,
    1+
    Math.random(),
    -7+
    (Math.random()-.5)*2
  );


  g.userData={
    life:1.2,
    velocity:
      new THREE.Vector3(
        (Math.random()-.5),
        2.2,
        (Math.random()-.5)
      ),
    amount
  };


  scene.add(g);

  floatingCash.push(g);

}


function updateFloatingCash(
  dt
){

  for(
    let i=
      floatingCash.length-1;
    i>=0;
    i--
  ){

    const f =
      floatingCash[i];


    f.userData.life -=
      dt;


    f.position.addScaledVector(
      f.userData.velocity,
      dt
    );


    f.userData.velocity.y -=
      3.5*dt;


    f.rotation.y +=
      dt*5;


    if(
      f.userData.life<=0
    ){

      scene.remove(f);

      floatingCash.splice(
        i,
        1
      );

    }

  }

}


/* ============================================================
   BUSINESS CASH DROPS
============================================================ */

const drops=[];

let dropTimer=0;


function spawnDrop(){

  if(
    state.businessLevel<=0
  )
    return;


  const g =
    new THREE.Group();


  box(
    0,
    0,
    0,
    .34,
    .14,
    .34,
    M.money,
    g
  );


  g.position.set(
    -2.5+
    Math.random()*5,
    .75,
    -2.2
  );


  g.userData={
    progress:0
  };


  business.add(g);

  drops.push(g);

}


function updateDrops(dt){

  if(
    state.businessLevel>0
  ){

    dropTimer +=
      dt;


    const interval =
      Math.max(
        .45,
        1.7-
        state.businessLevel*.08
      );


    if(
      dropTimer>=interval
    ){

      dropTimer=0;

      spawnDrop();

    }

  }


  for(
    let i=
      drops.length-1;
    i>=0;
    i--
  ){

    const d =
      drops[i];


    d.userData.progress +=
      dt*2.7;


    d.position.z =
      -2.2+
      d.userData.progress;


    d.rotation.y +=
      dt*5;


    if(
      d.userData.progress>5
    ){

      const amount =
        4+
        state.businessLevel*
        2;


      addCash(
        amount
      );


      business.remove(d);

      drops.splice(
        i,
        1
      );

    }

  }

}


/* ============================================================
   XP
============================================================ */

function xpNeeded(){

  return Math.floor(
    100*
    Math.pow(
      1.35,
      state.level-1
    )
  );

}


function gainXP(
  amount
){

  state.xp +=
    amount;


  while(
    state.xp>=xpNeeded()
  ){

    state.xp -=
      xpNeeded();


    state.level++;


    state.reputation +=
      .5;


    notify(
      "CITY LEVEL UP • LEVEL "+
      state.level
    );

  }


  updateUI();

}


/* ============================================================
   ECONOMY
============================================================ */

function incomePerSecond(){

  if(
    state.businessLevel<=0
  )
    return 0;


  return (
    3+
    state.businessLevel*
    2.7+
    state.businessCustomers*
    .03+
    state.reputation*
    .15
  );

}


function money(
  value
){

  if(
    value<1000
  ){

    return "$"+
      Math.floor(value);

  }


  if(
    value<1000000
  ){

    return "$"+
      (value/1000)
        .toFixed(
          value<10000
            ?1
            :0
        )+
      "K";

  }


  if(
    value<1000000000
  ){

    return "$"+
      (value/1000000)
        .toFixed(1)+
      "M";

  }


  return "$"+
    (value/1000000000)
      .toFixed(1)+
    "B";

}


/* ============================================================
   INTERACTION
============================================================ */

function nearestPad(){

  let nearest =
    null;

  let nearestDistance =
    Infinity;


  for(
    const p of pads
  ){

    if(
      !p.visible
    )
      continue;


    const position =
      new THREE.Vector3(
        p.userData.base.position.x,
        0,
        p.userData.base.position.z
      );


    const playerPosition =
      new THREE.Vector3(
        player.position.x,
        0,
        player.position.z
      );


    const distance =
      position.distanceTo(
        playerPosition
      );


    if(
      distance<
      nearestDistance
    ){

      nearestDistance =
        distance;

      nearest =
        p;

    }

  }


  if(
    nearestDistance<
    3.3
  )
    return nearest;


  return null;

}


function interact(){

  const pad =
    nearestPad();


  if(!pad)
    return;


  const id =
    pad.userData.id;


  if(
    id==="business"
  ){

    buyBusiness();

    return;

  }


  if(
    id==="upgrade"
  ){

    upgradeBusiness();

    return;

  }


  if(
    id==="expand"
  ){

    expandPlot();

    return;

  }

}


function buyBusiness(){

  if(
    state.businessLevel>0
  ){

    notify(
      "You already own a business."
    );

    return;

  }


  if(
    state.cash<250
  ){

    notify(
      "You need $250."
    );

    return;

  }


  state.cash -=
    250;


  state.businessLevel=1;

  state.reputation +=
    1;


  buildBusiness();


  notify(
    "NEON MARKET OPENED"
  );


  updatePads();

  updateUI();

  save();

}


function upgradeBusiness(){

  if(
    state.businessLevel<=0
  ){

    notify(
      "Build your business first."
    );

    return;

  }


  const cost =
    Math.floor(
      1000*
      Math.pow(
        1.7,
        state.businessLevel-1
      )
    );


  if(
    state.cash<cost
  ){

    notify(
      "You need "+
      money(cost)+
      "."
    );

    return;

  }


  state.cash -=
    cost;


  state.businessLevel++;


  state.reputation +=
    .5;


  buildBusiness();


  notify(
    "BUSINESS UPGRADED • LEVEL "+
    state.businessLevel
  );


  updateUI();

  save();

}


function expandPlot(){

  if(
    state.expansions>=3
  ){

    notify(
      "Maximum district expansion reached."
    );

    return;

  }


  const cost =
    5000*
    Math.pow(
      2,
      state.expansions
    );


  if(
    state.cash<cost
  ){

    notify(
      "You need "+
      money(cost)+
      "."
    );

    return;

  }


  state.cash -=
    cost;


  state.expansions++;

  state.plotSize +=
    8;

  state.district++;


  rebuildPlot();


  notify(
    "DISTRICT EXPANDED • "+
    "DISTRICT "+
    state.district
  );


  updateUI();

  save();

}


/* ============================================================
   PAD VISIBILITY
============================================================ */

function updatePads(){

  for(
    const p of pads
  ){

    const id =
      p.userData.id;


    if(
      id==="business"
    ){

      p.visible =
        state.businessLevel===0;

      p.userData.text.visible =
        p.visible;

    }


    if(
      id==="upgrade"
    ){

      p.visible =
        state.businessLevel>0;

      p.userData.text.visible =
        p.visible;


      if(p.visible){

        const cost =
          1000*
          Math.pow(
            1.7,
            state.businessLevel-1
          );


        p.userData.text =
          p.userData.text;

      }

    }


    if(
      id==="expand"
    ){

      p.visible =
        state.expansions<3;

      p.userData.text.visible =
        p.visible;

    }

  }

}

   UI
============================================================ */

  document.getElementById(

    );


  document.getElementById(

  ).textContent =

    document.getElementById(

    ).textContent =

      )+

        )
      );

/* ============================================================
   INTERACTION PROMPT
============================================================ */

function updatePrompt(){

  const interaction =
    document.getElementById(
      "interaction"
    );


  const pad =
    nearestPad();


  if(!pad){

      "none";

        )
      );

  ){

        )
      );

    "E • "+

}


/* ============================================================
   DAY / NIGHT
============================================================ */

let worldTime =
  .24;


function updateDayNight(dt){

  worldTime +=
    dt*.008;


  if(
    worldTime>=1
  )
    worldTime-=1;


  const angle =
    worldTime*
    Math.PI*2;


  const daylight =
    Math.max(
      0,
      Math.sin(angle)+.1
    );


  sun.intensity =
    .35+
    daylight*2.35;


  moon.intensity =
    Math.max(
      0,
      .7-
      daylight
    );


  hemi.intensity =
    .65+
    daylight*.95;


  const sky =
    new THREE.Color();


  if(
    daylight>.4
  ){

    sky.setHSL(
      .59,
      .35,
      .09+
      daylight*.06
    );

  }else{

    sky.setHSL(
      .66,
      .45,
      .025+
      daylight*.025
    );

  }


  scene.background.lerp(
    sky,
    .025
  );


  scene.fog.color.lerp(
    sky,
    .025
  );


  for(
    const lamp of streetLights
  ){

    lamp.material.emissiveIntensity =
      daylight>.4
        ?1.2
        :3;

  }

}


/* ============================================================
   OFFLINE INCOME
============================================================ */

function loadSave(){

  try{

    const saved =
      localStorage.getItem(
        SAVE_KEY
      );


    if(!saved)
      return;


    const data =
      JSON.parse(saved);


    Object.assign(
      state,
      data
    );


    const elapsed =
      Math.min(
        8*60*60,
        Math.max(
          0,
          (
            Date.now()-
            (
              data.lastSave||
              Date.now()
            )
          )/1000
        )
      );


    if(
      elapsed>20 &&
      state.businessLevel>0
    ){

      const earned =
        incomePerSecond()*
        elapsed*
        .45;


      state.cash +=
        earned;


      state.totalEarned +=
        earned;


      setTimeout(
        () => {

          notify(
            "WELCOME BACK • "+
            money(earned)+
            " OFFLINE EARNINGS"
          );

        },
        800
      );

    }

  }catch(error){

    console.warn(
      "Could not load save.",
      error
    );

  }

}


function save(){

  state.lastSave =
    Date.now();


  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(
      state
    )
  );


  notify(
    "GAME SAVED"
  );

}


function saveSilent(){

  state.lastSave =
    Date.now();


  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(
      state
    )
  );

}


document
  .getElementById(
    "saveBtn"
  )
  .addEventListener(
    "click",
    save
  );


document
  .getElementById(
    "upgradeBusiness"
  )
  .addEventListener(
    "click",
    upgradeBusiness
  );


/* ============================================================
   NOTIFICATIONS
============================================================ */

let notificationTimer;


function notify(
  text
){

  const n =
    document.getElementById(
      "notification"
    );


  n.textContent =
    text;


  n.classList.add(
    "show"
  );


  clearTimeout(
    notificationTimer
  );


  notificationTimer =
    setTimeout(
      () => {

        n.classList.remove(
          "show"
        );

      },
      2400
    );

}


/* ============================================================
   RESTORE WORLD
============================================================ */

loadSave();

rebuildPlot();

buildBusiness();

updatePads();

updateUI();


/* ============================================================
   ECONOMY TIMER
============================================================ */

let economyTimer=0;

let saveTimer=0;


function updateEconomy(
  dt
){

  economyTimer +=
    dt;


  if(
    economyTimer>=1
  ){

    economyTimer=0;


    if(
      state.businessLevel>0
    ){

      const passive =
        incomePerSecond();


      state.cash +=
        passive;


      state.totalEarned +=
        passive;


      gainXP(
        Math.max(
          1,
          Math.floor(
            passive*.25
          )
        )
      );

    }


    updateUI();

  }


  saveTimer +=
    dt;


  if(
    saveTimer>=15
  ){

    saveTimer=0;

    saveSilent();

  }

}


/* ============================================================
   MAIN LOOP
============================================================ */

function animate(){

  requestAnimationFrame(
    animate
  );


  const dt =
    Math.min(
      .05,
      clock.getDelta()
    );


  updatePlayer(dt);

  updateNPCs(dt);

  updateCars(dt);

  updateDrops(dt);

  updateFloatingCash(dt);

  updateDayNight(dt);

  updateEconomy(dt);

  updatePrompt();


  renderer.render(
    scene,
    camera
  );

}


animate();

   RESIZE

============================================================ */

);

============================================================ */

setTimeout(

    );

  },
